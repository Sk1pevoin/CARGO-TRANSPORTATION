<main>
    <div class="zayavka-container">
        <h2>Оставить заявку</h2>
        <div class="zayavka-content">
            <form id="zayavkaForm" class="zayavka-form">
                <label for="from">Откуда</label>
                <input type="text" id="from" name="otkuda" placeholder="Город, улица" required>

                <label for="to">Куда</label>
                <input type="text" id="to" name="kuda" placeholder="Город, улица" required>

                <div class="form-row">
                    <div>
                        <label for="weightValue">Вес груза</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="number" id="weightValue" name="weightValue" placeholder="Вес" min="0" step="0.01" required style="flex: 1;">
                            <select id="weightUnit" name="weightUnit" style="width: 80px;">
                                <option value="кг">кг</option>
                                <option value="т">т</option>
                            </select>
                        </div>
                        <input type="hidden" id="weight" name="ves">
                    </div>
                    <div>
                        <label for="type">Тип груза</label>
                        <select id="type" name="tip">
                            <option>Обычный</option>
                            <option>Хрупкий</option>
                            <option>Негабаритный</option>
                        </select>
                    </div>
                </div>

                <label for="date">Дата</label>
                <input type="date" id="date" name="date" required>

                <button type="submit">Отправить заявку</button>
            </form>

            <div class="zayavka-image">
                <img src="/Photos/truck.jpg" alt="Грузовик для грузоперевозок">
            </div>
        </div>

        <div id="zayavkiList"></div>
    </div>
</main>
