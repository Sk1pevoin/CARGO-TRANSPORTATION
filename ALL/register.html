<!DOCTYPE html>
<html lang="rus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="Styles/style.css">
  <link rel="stylesheet" href="Styles/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🚛 Грузоперевозки</h1>
        <h2>Регистрация</h2>
        <p>Создайте аккаунт для работы с системой</p>
      </div>
      
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="newUsername">
            <span class="label-icon">👤</span>
            Логин
          </label>
          <input type="text" id="newUsername" placeholder="Введите логин" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="newPassword">
            <span class="label-icon">🔒</span>
            Пароль
          </label>
          <input type="password" id="newPassword" placeholder="Введите пароль" required autocomplete="new-password">
        </div>

        <button type="submit" class="auth-button">
          <span>Зарегистрироваться</span>
        </button>
        
        <div id="success-message" class="message success-message" style="display:none;">
          <span class="message-icon">✓</span>
          <span>Пользователь успешно зарегистрирован! Перенаправление...</span>
        </div>
      </form>
      
      <div class="auth-footer">
        <p>Уже есть аккаунт? <a href="login.html" class="auth-link">Войти в систему</a></p>
        <a href="Web.html" class="back-link">← Вернуться на главную</a>
      </div>
    </div>
  </div>
<script src="JavaScript/database.js"></script>
<script src="JavaScript/Auth.js"></script>
<script src="JavaScript/script.js"></script>
<script src="JavaScript/cabinet.js"></script>
</body>
</html>
