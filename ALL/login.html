<!DOCTYPE html>
<html lang="rus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>
  <link rel="stylesheet" href="Styles/style.css">
  <link rel="stylesheet" href="Styles/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🚛 Грузоперевозки</h1>
        <h2>Вход в систему</h2>
        <p>Войдите в свой аккаунт</p>
      </div>
      
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="username">
            <span class="label-icon">👤</span>
            Логин
          </label>
          <input type="text" id="username" placeholder="Введите логин" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">
            <span class="label-icon">🔒</span>
            Пароль
          </label>
          <input type="password" id="password" placeholder="Введите пароль" required autocomplete="current-password">
        </div>

        <button type="submit" class="auth-button">
          <span>Войти</span>
        </button>
        
        <div id="error-message" class="message error-message" style="display:none;">
          <span class="message-icon">✗</span>
          <span>Неверный логин или пароль!</span>
        </div>
      </form>
      
      <div class="auth-footer">
        <p>Нет аккаунта? <a href="register.html" class="auth-link">Зарегистрироваться</a></p>
        <a href="Web.html" class="back-link">← Вернуться на главную</a>
      </div>
    </div>
  </div>
<script src="JavaScript/Auth.js"></script>
<script src="JavaScript/database.js"></script>
<script src="JavaScript/script.js"></script>
</body>
</html>
